<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ビンゴ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    cursor: pointer;
  }
  #num {
    font-size: min(48vw, 58vh);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: #000000;
  }
  #num.final { color: #e0000d; }
  #count {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    font-size: clamp(16px, 4vw, 24px);
    font-weight: 600;
    color: #666666;
    font-variant-numeric: tabular-nums;
  }
  #history {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom));
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-content: flex-end;
    max-height: 28vh;
    overflow: hidden;
  }
  .chip {
    font-size: clamp(15px, 3.4vw, 22px);
    font-weight: 600;
    color: #333333;
    background: #f0f0f0;
    border-radius: 999px;
    padding: 4px 12px;
    font-variant-numeric: tabular-nums;
  }
  .chip.last { background: #ffd9dc; color: #e0000d; }
</style>
</head>
<body>
<div id="count">0</div>
<div id="num">—</div>
<div id="history"></div>
<audio id="roll" preload="auto" playsinline webkit-playsinline>
  <source src="roll.mp3" type="audio/mpeg">
</audio>

<script>
(function(){
  var LOCK_TIME = 2.52;
  var NUMBERS = [45, 41, 33, 19, 38, 11, 31, 29, 4, 46, 9, 23, 3, 32, 37];
  var FORCE_LAST = 37;
  var TOTAL = NUMBERS.length;

  function buildOrder(){
    var rest = NUMBERS.filter(function(n){ return n !== FORCE_LAST; });
    for(var i = rest.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = rest[i]; rest[i] = rest[j]; rest[j] = t;
    }
    rest.push(FORCE_LAST);
    return rest;
  }
  var order = buildOrder();

  var count = 0;
  var state = "idle";
  var finished = false;
  var spinIv = null;
  var lockTimer = null;
  var audioUnlocked = false;
  var rollAudio = document.getElementById('roll');
  var numEl = document.getElementById('num');
  var countEl = document.getElementById('count');
  var historyEl = document.getElementById('history');

  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    var p = rollAudio.play();
    if(p && p.then){
      p.then(function(){ rollAudio.pause(); rollAudio.currentTime = 0; }).catch(function(){});
    } else {
      try { rollAudio.pause(); rollAudio.currentTime = 0; } catch(e){}
    }
  }

  function spinTick(){
    numEl.textContent = NUMBERS[Math.floor(Math.random() * NUMBERS.length)];
  }

  function addChip(value, isLast){
    var c = document.createElement('span');
    c.className = 'chip' + (isLast ? ' last' : '');
    c.textContent = value;
    historyEl.appendChild(c);
  }

  function lockResult(){
    if(state !== "spinning") return;
    clearInterval(spinIv);
    if(lockTimer){ clearTimeout(lockTimer); lockTimer = null; }
    var pick = order[count];
    count++;
    numEl.textContent = pick;
    countEl.textContent = count;
    var isLast = (count >= TOTAL);
    addChip(pick, isLast);
    state = "idle";
    if(isLast){
      numEl.classList.add('final');
      finished = true;
    }
  }

  function watchTime(){
    if(state === "spinning" && rollAudio.currentTime >= LOCK_TIME){
      lockResult();
    }
  }
  rollAudio.addEventListener('timeupdate', watchTime);

  function startSpin(){
    if(finished) return;
    state = "spinning";
    try { rollAudio.currentTime = 0; rollAudio.play(); } catch(e){}
    spinIv = setInterval(spinTick, 70);
    if(lockTimer) clearTimeout(lockTimer);
    lockTimer = setTimeout(lockResult, LOCK_TIME * 1000);
  }

  function trigger(){
    if(finished) return;
    if(state === "idle"){ startSpin(); }
  }

  document.addEventListener('keydown', function(e){
    if(e.code === "Space" || e.key === " "){
      e.preventDefault();
      trigger();
    }
  });
  document.addEventListener('touchend', function(e){
    e.preventDefault();
    unlockAudio();
    trigger();
  }, { passive: false });
  document.addEventListener('click', function(){
    unlockAudio();
    trigger();
  });
})();
</script>
</body>
</html>
